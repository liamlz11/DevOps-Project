name: Build, test, and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build and start three services
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Run API and real Redis tests
        run: docker compose exec -T api python -m unittest discover -s tests -v
      - name: Check HTTP behavior
        run: python3 scripts/check_demo.py
      - name: Verify Redis volume across container recreation
        run: |
          python3 scripts/check_demo.py --seed
          docker compose down
          docker compose up -d --wait --wait-timeout 120
          python3 scripts/check_demo.py --verify
          python3 scripts/check_demo.py --cleanup
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test services
        if: always()
        run: docker compose down

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [web, api, redis]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase package name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - name: Publish versioned image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
